[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "loom"
version = "0.1.0"
description = "Loom - minimal chat + tools browser agent (stagehand + selenium)."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "pillow>=11.0",
    "playwright>=1.40",
    "pydantic>=2.11",
    "pygments>=2.18",
    "rich>=13.0",
    "selenium>=4.0",
    "stagehand>=4.1.0",
    "typer>=0.12",
]

[project.urls]
Homepage = ""
Repository = ""
Issues = ""

[project.scripts]
loom = "loom_coding.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loom_ai", "src/loom_agent", "src/loom_coding"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["loom_ai", "loom_agent", "loom_coding"]

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
